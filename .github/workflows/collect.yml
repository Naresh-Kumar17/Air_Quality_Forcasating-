# Takes one air quality reading every hour, even when your laptop is off.
# Put this file in your GitHub repository at .github/workflows/collect.yml
# It saves live_data.csv and forecast_log.csv back into the repository.
# GitHub may delay or pause scheduled runs, so check the "Actions" tab now and then.

name: Collect air quality data

on:
  schedule:
    - cron: "5 * * * *"      # minute 5 of every hour
  workflow_dispatch:         # lets you start it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install requests pandas

      - name: Take one reading
        run: python collect_once.py

      - name: Save the new rows
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add live_data.csv forecast_log.csv
          git commit -m "Add new reading" || echo "Nothing new to save"
          git push
